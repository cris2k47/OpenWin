name: Update installers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-installers

jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip, not the commit the run was queued on, so a
          # run that waited for a previous update doesn't redo it.
          ref: ${{ github.ref }}

      - name: Download the latest Firefox release
        id: firefox
        run: python3 .github/scripts/update_firefox.py

      - name: Commit and push
        if: steps.firefox.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.firefox.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Firefox to $VERSION"
          git push

  seven-zip:
    # Run after the Firefox job, even if it failed, so the two never push at
    # the same time.
    needs: firefox
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip so a Firefox update pushed by the previous
          # job is included.
          ref: ${{ github.ref }}

      - name: Download the latest 7-Zip release
        id: sevenzip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_7zip.py

      - name: Commit and push
        if: steps.sevenzip.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.sevenzip.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 7-Zip to $VERSION"
          git push

  release:
    # Publish autounattend.iso and OpenWin.zip whenever autounattend.xml or
    # $OEM$ on the branch differ from the "latest" release, whether they changed
    # through an update above or any other push.
    needs: [firefox, seven-zip]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check whether the release is up to date
        id: check
        run: |
          # The Git object IDs of autounattend.xml and $OEM$ change exactly when
          # their contents do.
          contents() {
            gh api "repos/$GH_REPO/git/trees/$1" \
              --jq '[.tree[] | select(.path == "autounattend.xml" or .path == "$OEM$") | .sha] | join(" ")'
          }
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          released=$(gh api "repos/$GH_REPO/git/ref/tags/latest" --jq .object.sha 2>/dev/null) || released=
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$released" ] ||
             [ "$(contents "$sha")" != "$(contents "$released")" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "The latest release is up to date."
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.stale == 'true'
        with:
          ref: ${{ steps.check.outputs.sha }}

      - name: Build autounattend.iso and OpenWin.zip
        if: steps.check.outputs.stale == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage
          mkdir staging dist
          cp -r autounattend.xml '$OEM$' staging/
          # UDF for Windows Setup, plus Joliet and Rock Ridge for other systems.
          # -D keeps the deep $OEM$\$1\Users\Default\... folders where they are.
          genisoimage -quiet -o dist/autounattend.iso -V OPENWIN -udf -J -joliet-long -r -D staging
          (cd staging && zip -q -r -X ../dist/OpenWin.zip autounattend.xml '$OEM$')

      - name: Publish the latest release
        if: steps.check.outputs.stale == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          files='$OEM$/$$/Setup/Files'
          firefox=$(ls "$files" | sed -n 's/^Firefox Setup \(.*\)\.exe$/\1/p')
          sevenzip=$(ls "$files" | sed -n 's/^7z\([0-9]*\)\([0-9][0-9]\)-x64\.exe$/\1.\2/p')
          sed -e "s|@SHA@|$SHA|" -e "s|@FIREFOX@|$firefox|" -e "s|@SEVENZIP@|$sevenzip|" \
            -e "s|@REPO@|$GH_REPO|" > notes.md <<'EOF'
          Built from @SHA@ with Firefox @FIREFOX@ (with every language pack) and 7-Zip @SEVENZIP@.

          - **autounattend.iso**: attach it to a virtual machine as a second CD/DVD drive, next to the Windows 11 ISO.
          - **OpenWin.zip**: extract it and copy `autounattend.xml` and the `$OEM$` folder to the root of a USB drive made with the Media Creation Tool.

          See the [README](https://github.com/@REPO@#readme) for step-by-step instructions.
          EOF
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/autounattend.iso dist/OpenWin.zip --clobber
            # --draft=false republishes the release if deleting its tag turned it into
            # a draft; publishing recreates the tag at --target.
            gh release edit latest --draft=false --target "$SHA" --notes-file notes.md
            # Move the tag last, so a failed upload is retried on the next run.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$SHA" -F force=true > /dev/null
          else
            gh release create latest dist/autounattend.iso dist/OpenWin.zip --title OpenWin \
              --notes-file notes.md --target "$SHA"
          fi

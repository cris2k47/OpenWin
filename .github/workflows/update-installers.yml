name: Update installers

# An external scheduler (cron-job.org) starts this workflow every 5 minutes
# through the workflow_dispatch API, because GitHub's schedule trigger never
# fired for this repository.
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Publish a new release even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-installers

jobs:
  brave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip, not the commit the run was queued on, so a
          # run that waited for a previous update doesn't redo it.
          ref: ${{ github.ref }}

      - name: Pin the latest Brave release
        id: brave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_brave.py

      - name: Commit and push
        if: steps.brave.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.brave.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Brave to $VERSION"
          git push

  seven-zip:
    # Run after the Brave job, even if it failed, so the two never push at the
    # same time.
    needs: brave
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip so a Brave update pushed by the previous job
          # is included.
          ref: ${{ github.ref }}

      - name: Download the latest 7-Zip release
        id: sevenzip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_7zip.py

      - name: Commit and push
        if: steps.sevenzip.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.sevenzip.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 7-Zip to $VERSION"
          git push

  release:
    # Publish a new release with autounattend.iso and OpenWin.zip whenever
    # autounattend.xml or $OEM$ on the branch differ from the newest release,
    # whether they changed through an update above or any other push.
    needs: [brave, seven-zip]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check whether the newest release is up to date
        id: check
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          # The Git object IDs of autounattend.xml and $OEM$ change exactly when
          # their contents do.
          contents() {
            gh api "repos/$GH_REPO/git/trees/$1" \
              --jq '[.tree[] | select(.path == "autounattend.xml" or .path == "$OEM$") | .sha] | join(" ")'
          }
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          # The newest release's tag points at the commit it was built from.
          released=
          if tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null); then
            released=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null) || released=
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" = true ] || [ -z "$released" ] ||
             [ "$(contents "$sha")" != "$(contents "$released")" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "The newest release, $tag, is up to date."
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.stale == 'true'
        with:
          ref: ${{ steps.check.outputs.sha }}

      - name: Build autounattend.iso and OpenWin.zip
        if: steps.check.outputs.stale == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage
          mkdir staging dist
          cp -r autounattend.xml '$OEM$' staging/
          # Brave's installer is too big for the repository, which pins it in
          # Brave.json instead. Swap the pin for the verified installer.
          python3 .github/scripts/update_brave.py --download 'staging/$OEM$/$$/Setup/Files'
          rm 'staging/$OEM$/$$/Setup/Files/Brave.json'
          # UDF for Windows Setup, plus Joliet and Rock Ridge for other systems.
          # -D keeps the deep $OEM$\$1\Users\Default\... folders where they are.
          genisoimage -quiet -o dist/autounattend.iso -V OPENWIN -udf -J -joliet-long -r -D staging
          (cd staging && zip -q -r -X ../dist/OpenWin.zip autounattend.xml '$OEM$')

      - name: Publish a new release
        if: steps.check.outputs.stale == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          files='$OEM$/$$/Setup/Files'
          brave=$(jq -r .version "$files/Brave.json")
          sevenzip=$(ls "$files" | sed -n 's/^7z\([0-9]*\)\([0-9][0-9]\)-x64\.exe$/\1.\2/p')
          tag=$(date -u +%Y.%m.%d-%H%M)
          sed -e "s|@SHA@|$SHA|" -e "s|@BRAVE@|$brave|" -e "s|@SEVENZIP@|$sevenzip|" \
            -e "s|@REPO@|$GH_REPO|" > notes.md <<'EOF'
          Built from @SHA@ with Brave @BRAVE@ and 7-Zip @SEVENZIP@.

          - **autounattend.iso**: attach it to a virtual machine as a second CD/DVD drive, next to the Windows 11 ISO.
          - **OpenWin.zip**: extract it and copy `autounattend.xml` and the `$OEM$` folder to the root of a USB drive made with the Media Creation Tool.

          See the [README](https://github.com/@REPO@#readme) for step-by-step instructions.
          EOF
          # gh uploads the files to a draft and publishes it only once they're all
          # there, so the download links never point at a release without them.
          gh release create "$tag" dist/autounattend.iso dist/OpenWin.zip --latest --target "$SHA" \
            --title "OpenWin ${tag%-*} · Brave $brave · 7-Zip $sevenzip" --notes-file notes.md

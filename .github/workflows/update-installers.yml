name: Update installers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-installers

jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip, not the commit the run was queued on, so a
          # run that waited for a previous update doesn't redo it.
          ref: ${{ github.ref }}

      - name: Download the latest Firefox release
        id: firefox
        run: python3 .github/scripts/update_firefox.py

      - name: Commit and push
        if: steps.firefox.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.firefox.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Firefox to $VERSION"
          git push

  seven-zip:
    # Run after the Firefox job, even if it failed, so the two never push at
    # the same time.
    needs: firefox
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip so a Firefox update pushed by the previous
          # job is included.
          ref: ${{ github.ref }}

      - name: Download the latest 7-Zip release
        id: sevenzip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_7zip.py

      - name: Commit and push
        if: steps.sevenzip.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.sevenzip.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 7-Zip to $VERSION"
          git push
